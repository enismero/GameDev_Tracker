<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameDev Tracker</title>

    <link rel="stylesheet" href="/static/style.css"> 
    <script src="/static/app.js" defer></script>

</head>
<body>
    <header>
        <div>
            <h1>GameDev Tracker</h1>
            <p>ekibinin görevlerini tek yerde takip et.</p>
        </div>
        <button id="refresh-button" type="button">Yenile</button>
    </header>

    <p id="message" role="status" aria-live="polite"></p>

    <section class="panel">
        <h2>Yeni görev</h2>

        <form id="task-form">
            <label>
                Başlık
                <input id="title" maxlength="150" required>
            </label>

            <label>
                Açıklama
                <textarea id="description" rows="3"></textarea>
            </label>

            <div class="form-row">
                <label>
                    Öncelik
                    <select id="priority">
                        <option value="low">Düşük</option>
                        <option value="medium">Orta</option>
                        <option value="high">Yüksek</option>
                    </select>
                </label>

                <label>
                    Oluşturan kullanıcı
                    <select id="created-by" required>
                        <option value="">Kullanıcı seç</option>
                    </select>
                </label>

                <label>
                    Sorumlu kullanıcı ID
                    <select id="assigned-to">
                        <option value="">Atanmamış</option>
                    </select>
                </label>
            </div>

            <p class="hint">
                Görevi oluşturan kişiyi seç.
                Sorumlu kişiyi daha sonra atayabilirsin.
            </p>

            <button id="submit-button" type="submit">Görev ekle</button>
        </form>
    </section>

    <main id="board" class="board" aria-label="Görev panosu"></main>
</body>
</html>
